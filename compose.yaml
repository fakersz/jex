services:
  jex-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jex_api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - MUSIC_LIBRARY_PATH=/media/music
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-http://localhost:5173/auth/spotify/callback}
    volumes:
      - .:/app
      - /app/node_modules
      - ./media/music:/media/music:ro
    restart: unless-stopped

  jex-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jex_assistant
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_PORT=5173
      - VITE_API_URL=http://jex-api:3001
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - jex-api
    restart: unless-stopped
